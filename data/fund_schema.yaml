schema_version: "2026.1"
fund_metadata:
  fund_id: "APEX-MACF-01"
  fund_name: "Apex Global Multi-Asset Credit & Equity Fund"
  base_currency: "USD"
  total_nav_usd: 100000000.00
  effective_mandate_id: "IPS-APEX-2026-V4"

tables:
  holdings_ledger:
    description: "Current settled positions in the Fund (SEC Form N-PORT schema)"
    pruned_columns_for_llm:
      - name: "position_id"
        type: "string"
        description: "Unique identifier for the holding row"
      - name: "issuer_id"
        type: "string"
        description: "Legal entity identifier of the direct issuer"
      - name: "issuer_name"
        type: "string"
        description: "Legal name of the direct issuer"
      - name: "ultimate_parent_id"
        type: "string"
        description: "Canonical parent group ID for Section 1.04 / 3.01(b) aggregation"
      - name: "ultimate_parent_name"
        type: "string"
        description: "Canonical parent corporation name"
      - name: "asset_class"
        type: "enum[CORPORATE_BOND, SOVEREIGN_BOND, EQUITY, STRUCTURED_NOTE_SPV]"
        description: "Instrument classification"
      - name: "gics_sector"
        type: "string"
        description: "GICS sector (e.g., Technology, Energy, Financials, Industrials, Sovereign)"
      - name: "rating_sp"
        type: "string"
        description: "Standard & Poor's credit rating (e.g., AAA, AA+, A, BBB-, BB+, B, CCC+)"
      - name: "rating_moodys"
        type: "string"
        description: "Moody's credit rating (e.g., Aaa, Aa1, A2, Baa3, Ba1, B2, Caa1)"
      - name: "currency"
        type: "string"
        description: "ISO currency code of the security (USD, JPY, EUR, BRL, etc.)"
      - name: "is_fx_hedged"
        type: "boolean"
        description: "Whether non-USD exposure is 100% hedged back to USD"
      - name: "is_oecd_country"
        type: "boolean"
        description: "Whether the issuer's domicile is an OECD member state"
      - name: "thermal_coal_revenue_pct"
        type: "float"
        description: "Direct percentage of revenue from thermal coal extraction"
      - name: "market_value_usd"
        type: "float"
        description: "Current settled market value in USD"
    excluded_internal_columns:
      - "custodian_account_number"
      - "prime_broker_Clearance_code"
      - "trader_desk_internal_notes"
      - "fix_protocol_raw_payload"
      - "settlement_wire_aba_routing"

